spring:
  application:
    name: afc-gym-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  email:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    password-reset-url: ${PASSWORD_RESET_URL:}
  security:
    jwt-secret: ${SECRET_KEY}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
    session-max-hours: ${SESSION_MAX_HOURS:12}
    bcrypt-strength: 12
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@afcgym.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    videos-directory: ${VIDEOS_DIRECTORY:./data/videos}
  notifications:
    expo-push-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
    expiry-reminder-days-before: ${EXPIRY_REMINDER_DAYS_BEFORE:3}
    expiry-reminder-cron: ${EXPIRY_REMINDER_CRON:0 0 9 * * *}
  payments:
    appointment-minutes: ${PAYMENT_APPOINTMENT_MINUTES:30}
    appointment-max-days-ahead: ${PAYMENT_APPOINTMENT_MAX_DAYS_AHEAD:30}
    bank-transfer:
      bank-name: ${BANK_TRANSFER_BANK_NAME:}
      beneficiary: ${BANK_TRANSFER_BENEFICIARY:}
      clabe: ${BANK_TRANSFER_CLABE:}
    mercado-pago:
      api-url: ${MERCADO_PAGO_API_URL:https://api.mercadopago.com}
      access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
      webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
      notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
      back-url: ${MERCADO_PAGO_BACK_URL:}
