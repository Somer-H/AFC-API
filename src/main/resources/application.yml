spring:
  application:
    name: afc-gym-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${SECRET_KEY}
    jwt-ttl-minutes: 60
    bcrypt-strength: 12
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@afcgym.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    videos-directory: ${VIDEOS_DIRECTORY:./data/videos}
