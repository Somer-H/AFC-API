spring:
  datasource:
    url: jdbc:h2:file:./data/afc-gym-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    jwt-secret: ${SECRET_KEY:dev-only-secret-do-not-use-in-production-0123456789}
  bootstrap-admin:
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin12345!}
  payments:
    bank-transfer:
      bank-name: ${BANK_TRANSFER_BANK_NAME:Banco de pruebas}
      beneficiary: ${BANK_TRANSFER_BENEFICIARY:AFC Gym datos de prueba}
      clabe: ${BANK_TRANSFER_CLABE:000000000000000000}
